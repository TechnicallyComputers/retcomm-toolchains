# Build cmake-clang-v1 packs and publish GitHub Release assets.
#
# Triggers:
#   - workflow_dispatch
#   - push tags v*

name: Release toolchains

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: retcomm-toolchains-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Assemble packs (ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packager deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zip patchelf binutils zstd make cmake ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Package linux-x64
        run: |
          chmod +x scripts/*.sh
          ./scripts/package_linux_x64.sh dist

      - name: Package windows-x64
        run: ./scripts/package_windows_x64.sh dist

      - name: Package macos-universal
        run: ./scripts/package_macos.sh macos-universal dist

      - name: List artifacts
        run: ls -lah dist/*.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmake-clang-v1-packs
          path: dist/cmake-clang-v1-*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packs
        uses: actions/download-artifact@v4
        with:
          name: cmake-clang-v1-packs
          path: dist

      - name: Resolve tag
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          ls -lah dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: cmake-clang-v1 ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: dist/cmake-clang-v1-*.zip
          fail_on_unmatched_files: true
          # workflow_dispatch may re-publish the VERSION tag
          make_latest: true
